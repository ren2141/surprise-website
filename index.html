<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Something Special is Coming ❤️</title>

<link rel="stylesheet" href="countdown.css">

</head>
<body>

<div class="container">

    <h1>🎁</h1>

    <h2>A Surprise Awaits...</h2>

    <p>
        Don't open before the countdown ends.
    </p>

    <div id="countdown">

        <div class="box">
            <span id="days">00</span>
            <small>Days</small>
        </div>

        <div class="box">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div class="box">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div class="box">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>

    </div>

</div>

<script src="countdown.js"></script>

</body>
</html>
